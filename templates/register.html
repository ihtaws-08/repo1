

<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        /* HEADER */

        .header {
            background: #17365d;
            color: white;

            padding: 20px 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .college-name {
            font-size: 21px;
            font-weight: 600;
        }

        .system-name {
            font-size: 13px;
            color: #dbe7f5;
        }

        /* MAIN */

        .main {
            min-height: calc(100vh - 70px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .container {
            width: 760px;

            background: white;

            border: 1px solid #e1e5ea;
            border-radius: 8px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);

            padding: 40px;
        }

        /* TITLE */

        .heading {
            margin-bottom: 28px;
        }

        .heading h1 {
            margin: 0 0 8px;

            font-size: 27px;
            font-weight: 600;

            color: #17365d;
        }

        .heading p {
            margin: 0;

            font-size: 13px;
            color: #667085;
        }

        .line {
            width: 45px;
            height: 3px;

            background: #2f75b5;

            margin: 14px 0 18px;
        }

        /* FORM */

        .form-row {
            display: flex;
            gap: 20px;
        }

        .field {
            flex: 1;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;

            color: #344054;
        }

        input,
        select {
            width: 100%;

            padding: 11px 12px;

            margin-bottom: 20px;

            border: 1px solid #d0d5dd;
            border-radius: 6px;

            background: white;

            font-size: 13px;
            color: #344054;

            outline: none;

            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #2f75b5;

            box-shadow:
                0 0 0 3px rgba(47, 117, 181, 0.1);
        }

        /* BUTTON */

        button {
            width: 100%;

            padding: 12px;

            margin-top: 5px;

            border: none;
            border-radius: 6px;

            background: #17365d;

            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #24558a;
        }

        /* NOTE */

        .note {
            text-align: center;

            margin-top: 18px;

            font-size: 11px;

            color: #8a929c;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .header {
                padding: 18px 20px;
            }

            .system-name {
                display: none;
            }

            .main {
                padding: 25px 15px;
            }

            .container {
                width: 100%;
                padding: 28px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <div class="college-name">
            College Student Services
        </div>

        <div class="system-name">
            Student Management System
        </div>

    </header>


    <!-- MAIN -->

    <main class="main">

        <div class="container">

            <div class="heading">

                <h1>Student Registration</h1>

                <div class="line"></div>

                <p>
                    Please enter the student's details accurately
                    to complete the registration.
                </p>

            </div>


            <form action="/register" method="POST">


                <!-- NAME -->

                <label>Name</label>

                <input 
                    type="text" 
                    name="name" 
                    placeholder="Enter full name" 
                    required
                >


                <!-- AGE + PHONE -->
                
                <div class="form-row">

                    <div class="field">

                        <label>Age</label>

                        <input 
                            type="number" 
                            name="age" 
                            placeholder="Enter age" 
                            required
                        >

                    </div>


                    <div class="field">

                        <label>Phone</label>

                        <input 
                            type="tel" 
                            name="phone" 
                            placeholder="Enter phone number" 
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <label>Email</label>

                <input 
                    type="email" 
                    name="email" 
                    placeholder="Enter email address" 
                    required
                >


                <!-- DEPARTMENT + YEAR -->

                <div class="form-row">

                    <div class="field">

                        <label>Department</label>

                        <select name="department" required>

                            <option value="">
                                Select department
                            </option>

                            <option value="CSE">
                                Computer Science Engineering
                            </option>

                            <option value="ECE">
                                Electronics & Communication
                            </option>

                            <option value="EEE">
                                Electrical & Electronics
                            </option>

                            <option value="Mechanical">
                                Mechanical Engineering
                            </option>

                            <option value="Civil">
                                Civil Engineering
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>Year</label>

                        <select name="year" required>

                            <option value="">
                                Select year
                            </option>

                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>

                        </select>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button type="submit">
                    Register Student
                </button>

            </form>


            <div class="note">
                Please verify all information before submitting.
            </div>

        </div>

    </main>

</body>

</html>
